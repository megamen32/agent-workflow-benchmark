[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-benchmark"
version = "0.1.0"
description = "Outcome-first benchmark runner for agent workflows"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
agent-workflow-benchmark = "agent_workflow_benchmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent_workflow_benchmark*"]
